stages:
  - build
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  CI_REGISTRY: "192.168.1.152:5001"
  DOCKER_INSECURE_REGISTRIES: "192.168.1.152:5001"

build_image:
  stage: build
  image: docker:latest

  services:
    - name: docker:dind
      
  variables:
    DOCKER_HOST: tcp://docker:2375/
    DOCKER_TLS_CERTDIR: ""

  script:
    - echo "=== Docker info ==="
    - docker info | grep -A3 "Insecure"

    - echo "=== Login to registry ==="
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" http://192.168.1.152:5001

    - echo "=== Build and push image ==="
    - docker build -t $CI_REGISTRY_IMAGE:latest .

    - echo "=== Push image ==="
    - docker push $CI_REGISTRY_IMAGE:latest
  only:
    - main

deploy:
  stage: deploy
  image: alpine:latest

  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H 192.168.1.98 >> ~/.ssh/known_hosts

  script:
    - |
      ssh deploy@192.168.1.98 "
        docker pull $CI_REGISTRY_IMAGE:latest &&
        docker stop app || true &&
        docker rm app || true &&
        docker run -d --name app -p 5000:8000 \
          -e DB_HOST=$DB_HOST \
          -e DB_PORT=$DB_PORT \
          -e DB_USER=$DB_USER \
          -e DB_PASS=$DB_PASS \
          -e DB_NAME=$DB_NAME \
          -e SECRET_KEY=$SECRET_KEY \
          $CI_REGISTRY_IMAGE:latest
      "

  only:
    - main

