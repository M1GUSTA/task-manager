stages:
  - build
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  CI_REGISTRY: "http://192.168.1.152:5001"
  DOCKER_INSECURE_REGISTRIES: "192.168.1.152:5001"

build_image:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375/
    DOCKER_TLS_CERTDIR: ""

  script:
    - docker info | grep -A3 "Insecure"
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" http://192.168.1.152:5001
    - docker build -t $CI_REGISTRY_IMAGE:latest .
    - docker push $CI_REGISTRY_IMAGE:latest
  only:
    - main

deploy:
  stage: deploy
  image: alpine:latest

  before_script:
    - apk add --no-cache openssh-client

    # создаём .ssh
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh

    # кладём приватный ключ
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519

    # known_hosts чтобы не спрашивал confirm
    - ssh-keyscan -H 192.168.1.97 >> ~/.ssh/known_hosts

  script:
    - ssh migusta@192.168.1.97 "docker pull $CI_REGISTRY_IMAGE:latest && docker run -d -p 5000:5000 $CI_REGISTRY_IMAGE:latest"

  only:
    - main
